<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PONG // ARENA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --bg-0: #05060a;
    --bg-1: #0a0e18;
    --cyan: #4deaff;
    --cyan-dim: #1c6b7a;
    --magenta: #ff4dc4;
    --magenta-dim: #7a1c5e;
    --white: #eef4ff;
    --grid: rgba(120,150,220,0.07);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg-0);
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--white);
    -webkit-user-select:none; user-select:none;
    touch-action: none;
  }

  #stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(77,234,255,0.10), transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(255,77,196,0.10), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
  }

  #arena-wrap{
    position: relative;
    width: min(96vw, 168vh);
    height: min(96vw / 1.7778, 92vh);
    max-width: 1400px;
  }

  canvas#game{
    display:block;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    box-shadow:
      0 0 0 1px rgba(120,150,220,0.14),
      0 0 60px rgba(77,234,255,0.06),
      0 0 60px rgba(255,77,196,0.05),
      0 40px 90px -30px rgba(0,0,0,0.8);
    background: transparent;
  }

  /* HUD */
  .hud{
    position:absolute;
    top: -1px;
    left: 0; right: 0;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding: clamp(10px, 2vw, 26px) clamp(14px, 3vw, 40px);
    pointer-events:none;
    z-index: 5;
  }

  .player-tag{
    display:flex;
    flex-direction:column;
    gap: 2px;
  }
  .player-tag.right{ align-items:flex-end; }

  .player-label{
    font-family:'Orbitron', sans-serif;
    font-size: clamp(9px, 1.1vw, 12px);
    letter-spacing: 3px;
    font-weight:700;
    opacity:0.55;
  }
  .player-tag.left .player-label{ color: var(--cyan); }
  .player-tag.right .player-label{ color: var(--magenta); }

  .player-score{
    font-family:'Orbitron', sans-serif;
    font-size: clamp(34px, 7vw, 84px);
    font-weight:900;
    line-height:1;
    letter-spacing: 2px;
    text-shadow: 0 0 24px currentColor, 0 0 60px currentColor;
  }
  .player-tag.left .player-score{ color: var(--cyan); }
  .player-tag.right .player-score{ color: var(--magenta); }

  .keys{
    font-family:'Space Grotesk', sans-serif;
    font-size: clamp(8px, 0.9vw, 11px);
    letter-spacing:1.5px;
    opacity:0.35;
    margin-top: 4px;
  }
  .player-tag.left .keys{ color: var(--cyan); }
  .player-tag.right .keys{ color: var(--magenta); }

  /* Overlay */
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background: rgba(5,6,10,0.72);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    z-index: 10;
    opacity:1;
    transition: opacity .35s ease;
    padding: 24px;
    gap: clamp(10px, 2vh, 22px);
  }
  .overlay.hidden{ opacity:0; pointer-events:none; }

  .logo{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size: clamp(30px, 6vw, 68px);
    letter-spacing: 10px;
    background: linear-gradient(90deg, var(--cyan), var(--white) 50%, var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px rgba(77,234,255,0.25)) drop-shadow(0 0 20px rgba(255,77,196,0.2));
    margin:0;
  }

  .sub{
    font-size: clamp(11px, 1.3vw, 15px);
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.55;
    font-weight: 500;
  }

  .prompt{
    margin-top: 6px;
    font-family:'Orbitron', sans-serif;
    font-size: clamp(13px, 1.6vw, 18px);
    letter-spacing: 3px;
    padding: 14px 30px;
    border: 1px solid rgba(238,244,255,0.25);
    border-radius: 999px;
    animation: pulseGlow 1.8s ease-in-out infinite;
  }

  @keyframes pulseGlow{
    0%, 100% { box-shadow: 0 0 0 rgba(238,244,255,0.0); border-color: rgba(238,244,255,0.2); }
    50% { box-shadow: 0 0 24px rgba(238,244,255,0.18); border-color: rgba(238,244,255,0.55); }
  }

  .controls-row{
    display:flex;
    gap: clamp(20px, 5vw, 70px);
    margin-top: clamp(8px, 2vh, 10px);
    flex-wrap: wrap;
    justify-content:center;
  }
  .control-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .control-block .who{
    font-size: 10px;
    letter-spacing:2px;
    opacity:0.5;
    text-transform:uppercase;
  }
  .keycap{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(238,244,255,0.22);
    font-family:'Orbitron', sans-serif;
    font-size: 12px;
    font-weight:700;
    box-shadow: 0 2px 0 rgba(238,244,255,0.08), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .keyrow{ display:flex; gap:6px; }

  .winner-name{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size: clamp(20px, 3vw, 30px);
    letter-spacing: 3px;
  }

  .footer-hint{
    position:absolute;
    bottom: clamp(8px, 2vh, 18px);
    left:0; right:0;
    text-align:center;
    font-size: clamp(9px, 1vw, 11px);
    letter-spacing: 2px;
    opacity: 0.3;
    z-index: 4;
    pointer-events:none;
  }

  @media (max-width: 640px){
    .controls-row{ display:none; }
    .sub{ display:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="arena-wrap">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="player-tag left">
        <div class="player-label">JUGADOR 1</div>
        <div class="player-score" id="scoreLeft">0</div>
        <div class="keys">A ▲ &nbsp; Z ▼</div>
      </div>
      <div class="player-tag right">
        <div class="player-label">JUGADOR 2</div>
        <div class="player-score" id="scoreRight">0</div>
        <div class="keys">▲ &nbsp; ▼</div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <h1 class="logo">PONG</h1>
      <div class="sub">Arena digital · Primero en llegar a 7</div>
      <div class="controls-row">
        <div class="control-block">
          <div class="who" style="color:var(--cyan)">Jugador 1</div>
          <div class="keyrow">
            <span class="keycap">A</span>
          </div>
          <div class="keyrow">
            <span class="keycap">Z</span>
          </div>
        </div>
        <div class="control-block">
          <div class="who" style="color:var(--magenta)">Jugador 2</div>
          <div class="keyrow"><span class="keycap">▲</span></div>
          <div class="keyrow"><span class="keycap">▼</span></div>
        </div>
      </div>
      <div class="prompt" id="promptText">PRESIONÁ ESPACIO PARA JUGAR</div>
    </div>

  </div>
  <div class="footer-hint">ESPACIO · INICIAR / PAUSAR &nbsp;—&nbsp; A / Z &nbsp;·&nbsp; ↑ / ↓</div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('arena-wrap');
  const overlay = document.getElementById('overlay');
  const promptText = document.getElementById('promptText');
  const logoEl = overlay.querySelector('.logo');
  const subEl = overlay.querySelector('.sub');
  const controlsRow = overlay.querySelector('.controls-row');
  const scoreLeftEl = document.getElementById('scoreLeft');
  const scoreRightEl = document.getElementById('scoreRight');

  const COLOR_CYAN = '#4deaff';
  const COLOR_MAGENTA = '#ff4dc4';
  const COLOR_WHITE = '#eef4ff';

  const WIN_SCORE = 7;

  let W = 0, H = 0, DPR = 1;

  function resize(){
    const rect = wrap.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  // Game state
  const state = {
    mode: 'idle', // idle | playing | paused | gameover
    scoreLeft: 0,
    scoreRight: 0,
    winner: null
  };

  const paddleL = { x:0, y:0, w:0, h:0, speed:0, vy:0, targetDir:0 };
  const paddleR = { x:0, y:0, w:0, h:0, speed:0, vy:0, targetDir:0 };
  const ball = { x:0, y:0, r:0, vx:0, vy:0, speed:0, trail:[] };

  function layout(){
    const pW = Math.max(8, W * 0.011);
    const pH = H * 0.18;
    paddleL.w = pW; paddleL.h = pH;
    paddleR.w = pW; paddleR.h = pH;
    paddleL.x = W * 0.045;
    paddleR.x = W - W * 0.045 - pW;
    if(paddleL.y === 0 && paddleR.y === 0){
      paddleL.y = H/2 - pH/2;
      paddleR.y = H/2 - pH/2;
    } else {
      paddleL.y = Math.min(Math.max(paddleL.y, 0), H - paddleL.h);
      paddleR.y = Math.min(Math.max(paddleR.y, 0), H - paddleR.h);
    }
    paddleL.speed = H * 1.05;
    paddleR.speed = H * 1.05;

    ball.r = Math.max(6, W * 0.009);
    ball.speed = W * 0.62;

    if(state.mode === 'idle'){
      centerBall(Math.random() < 0.5 ? 1 : -1);
    }
  }

  function centerBall(dir){
    ball.x = W/2;
    ball.y = H/2;
    const angle = (Math.random() * 0.5 - 0.25);
    ball.vx = Math.cos(angle) * ball.speed * dir;
    ball.vy = Math.sin(angle) * ball.speed;
    ball.trail.length = 0;
  }

  // Particles
  let particles = [];
  function spawnBurst(x, y, color, count, power){
    for(let i=0;i<count;i++){
      const a = Math.random() * Math.PI * 2;
      const sp = (0.3 + Math.random()*0.7) * power;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.7 + Math.random()*0.9,
        size: 1.5 + Math.random()*2.5,
        color
      });
    }
  }
  function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= p.decay * dt;
      if(p.life <= 0) particles.splice(i,1);
    }
  }
  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * Math.max(p.life,0.15), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // Screen shake
  let shake = 0;
  function addShake(v){ shake = Math.min(shake + v, 18); }

  // Input
  const keys = { a:false, z:false, ArrowUp:false, ArrowDown:false };

  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space'){
      e.preventDefault();
      onSpace();
      return;
    }
    const k = e.key;
    if(k === 'a' || k === 'A') keys.a = true;
    if(k === 'z' || k === 'Z') keys.z = true;
    if(k === 'ArrowUp'){ e.preventDefault(); keys.ArrowUp = true; }
    if(k === 'ArrowDown'){ e.preventDefault(); keys.ArrowDown = true; }
  });
  window.addEventListener('keyup', (e)=>{
    const k = e.key;
    if(k === 'a' || k === 'A') keys.a = false;
    if(k === 'z' || k === 'Z') keys.z = false;
    if(k === 'ArrowUp') keys.ArrowUp = false;
    if(k === 'ArrowDown') keys.ArrowDown = false;
  });

  function onSpace(){
    if(state.mode === 'idle'){
      startGame();
    } else if(state.mode === 'playing'){
      pauseGame();
    } else if(state.mode === 'paused'){
      resumeGame();
    } else if(state.mode === 'gameover'){
      resetMatch();
      startGame();
    }
  }

  function showOverlay(){ overlay.classList.remove('hidden'); }
  function hideOverlay(){ overlay.classList.add('hidden'); }

  function startGame(){
    state.mode = 'playing';
    hideOverlay();
  }
  function pauseGame(){
    state.mode = 'paused';
    logoEl.textContent = 'PAUSA';
    subEl.style.display = 'none';
    controlsRow.style.display = 'none';
    promptText.textContent = 'ESPACIO PARA CONTINUAR';
    showOverlay();
  }
  function resumeGame(){
    state.mode = 'playing';
    hideOverlay();
  }
  function resetMatch(){
    state.scoreLeft = 0;
    state.scoreRight = 0;
    scoreLeftEl.textContent = '0';
    scoreRightEl.textContent = '0';
    state.winner = null;
    logoEl.textContent = 'PONG';
    logoEl.style.background = '';
    logoEl.style.webkitBackgroundClip = '';
    logoEl.style.backgroundClip = '';
    subEl.style.display = '';
    controlsRow.style.display = '';
    centerBall(Math.random() < 0.5 ? 1 : -1);
  }
  function gameOver(winnerSide){
    state.mode = 'gameover';
    state.winner = winnerSide;
    const isLeft = winnerSide === 'left';
    logoEl.innerHTML = `<span class="winner-name" style="color:${isLeft?COLOR_CYAN:COLOR_MAGENTA}">JUGADOR ${isLeft?1:2} GANA</span>`;
    subEl.style.display = 'none';
    controlsRow.style.display = 'none';
    promptText.textContent = 'ESPACIO PARA JUGAR DE NUEVO';
    showOverlay();
  }

  // Touch controls (mobile responsive support)
  let touchZones = [];
  canvas.addEventListener('touchstart', handleTouch, {passive:false});
  canvas.addEventListener('touchmove', handleTouch, {passive:false});
  canvas.addEventListener('touchend', ()=>{ touchZones = []; }, {passive:false});
  function handleTouch(e){
    e.preventDefault();
    if(state.mode === 'idle'){ startGame(); return; }
    touchZones = [];
    for(const t of e.touches){
      const rect = canvas.getBoundingClientRect();
      const x = t.clientX - rect.left;
      const y = t.clientY - rect.top;
      touchZones.push({ x, y, side: x < W/2 ? 'left' : 'right' });
    }
  }

  function updatePaddles(dt){
    // left: a = up, z = down
    let lDir = 0;
    if(keys.a) lDir -= 1;
    if(keys.z) lDir += 1;
    let rDir = 0;
    if(keys.ArrowUp) rDir -= 1;
    if(keys.ArrowDown) rDir += 1;

    for(const tz of touchZones){
      const dir = tz.y < H/2 ? -1 : 1;
      if(tz.side === 'left') lDir = dir;
      else rDir = dir;
    }

    paddleL.y += lDir * paddleL.speed * dt;
    paddleR.y += rDir * paddleR.speed * dt;

    paddleL.y = Math.min(Math.max(paddleL.y, 0), H - paddleL.h);
    paddleR.y = Math.min(Math.max(paddleR.y, 0), H - paddleR.h);
  }

  function updateBall(dt){
    ball.trail.push({x: ball.x, y: ball.y});
    if(ball.trail.length > 14) ball.trail.shift();

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // top/bottom walls
    if(ball.y - ball.r < 0){
      ball.y = ball.r;
      ball.vy *= -1;
      spawnBurst(ball.x, ball.r, COLOR_WHITE, 14, 220);
      addShake(3);
    } else if(ball.y + ball.r > H){
      ball.y = H - ball.r;
      ball.vy *= -1;
      spawnBurst(ball.x, H - ball.r, COLOR_WHITE, 14, 220);
      addShake(3);
    }

    // paddle collisions
    if(ball.vx < 0 &&
       ball.x - ball.r < paddleL.x + paddleL.w &&
       ball.x - ball.r > paddleL.x - 20 &&
       ball.y > paddleL.y - ball.r &&
       ball.y < paddleL.y + paddleL.h + ball.r){
      const rel = (ball.y - (paddleL.y + paddleL.h/2)) / (paddleL.h/2);
      const angle = rel * (Math.PI/3.2);
      const sp = Math.min(Math.hypot(ball.vx, ball.vy) * 1.06, ball.speed * 2.1);
      ball.vx = Math.cos(angle) * sp;
      ball.vy = Math.sin(angle) * sp;
      ball.x = paddleL.x + paddleL.w + ball.r;
      spawnBurst(ball.x, ball.y, COLOR_CYAN, 20, 280);
      addShake(5);
    }
    if(ball.vx > 0 &&
       ball.x + ball.r > paddleR.x &&
       ball.x + ball.r < paddleR.x + paddleR.w + 20 &&
       ball.y > paddleR.y - ball.r &&
       ball.y < paddleR.y + paddleR.h + ball.r){
      const rel = (ball.y - (paddleR.y + paddleR.h/2)) / (paddleR.h/2);
      const angle = Math.PI - rel * (Math.PI/3.2);
      const sp = Math.min(Math.hypot(ball.vx, ball.vy) * 1.06, ball.speed * 2.1);
      ball.vx = Math.cos(angle) * sp;
      ball.vy = Math.sin(angle) * sp;
      ball.x = paddleR.x - ball.r;
      spawnBurst(ball.x, ball.y, COLOR_MAGENTA, 20, 280);
      addShake(5);
    }

    // scoring
    if(ball.x < -40){
      state.scoreRight++;
      scoreRightEl.textContent = state.scoreRight;
      spawnBurst(0, ball.y, COLOR_MAGENTA, 40, 380);
      addShake(10);
      if(state.scoreRight >= WIN_SCORE){ gameOver('right'); }
      else { centerBall(1); }
    } else if(ball.x > W + 40){
      state.scoreLeft++;
      scoreLeftEl.textContent = state.scoreLeft;
      spawnBurst(W, ball.y, COLOR_CYAN, 40, 380);
      addShake(10);
      if(state.scoreLeft >= WIN_SCORE){ gameOver('left'); }
      else { centerBall(-1); }
    }
  }

  function drawCourt(){
    ctx.clearRect(0,0,W,H);

    // subtle grid
    ctx.strokeStyle = 'rgba(120,150,220,0.06)';
    ctx.lineWidth = 1;
    const step = Math.max(28, W/28);
    for(let x=0; x<W; x+=step){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for(let y=0; y<H; y+=step){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }

    // center line
    ctx.save();
    ctx.setLineDash([H*0.018, H*0.018]);
    ctx.strokeStyle = 'rgba(238,244,255,0.18)';
    ctx.lineWidth = Math.max(2, W*0.0025);
    ctx.beginPath();
    ctx.moveTo(W/2, 0);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.restore();

    // center glow ring
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, H*0.28);
    grad.addColorStop(0, 'rgba(238,244,255,0.05)');
    grad.addColorStop(1, 'rgba(238,244,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(W/2, H/2, H*0.28, 0, Math.PI*2);
    ctx.fill();
  }

  function drawPaddle(p, color){
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 22;
    ctx.fillStyle = color;
    const r = Math.min(p.w/2, 8);
    roundRect(ctx, p.x, p.y, p.w, p.h, r);
    ctx.fill();
    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function drawBall(){
    // trail
    for(let i=0;i<ball.trail.length;i++){
      const t = ball.trail[i];
      const alpha = (i / ball.trail.length) * 0.35;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = COLOR_WHITE;
      ctx.beginPath();
      ctx.arc(t.x, t.y, ball.r * (i/ball.trail.length), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.shadowColor = COLOR_WHITE;
    ctx.shadowBlur = 26;
    ctx.fillStyle = COLOR_WHITE;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  let lastTime = performance.now();
  function loop(now){
    const dt = Math.min((now - lastTime) / 1000, 0.033);
    lastTime = now;

    if(state.mode === 'playing'){
      updatePaddles(dt);
      updateBall(dt);
    } else if(state.mode === 'idle'){
      // gentle idle ball float for visual life
      ball.x += ball.vx * dt * 0.25;
      ball.y += ball.vy * dt * 0.25;
      if(ball.y - ball.r < 0 || ball.y + ball.r > H) ball.vy *= -1;
      if(ball.x - ball.r < 0 || ball.x + ball.r > W) ball.vx *= -1;
      ball.trail.push({x: ball.x, y: ball.y});
      if(ball.trail.length > 14) ball.trail.shift();
    }

    updateParticles(dt);
    if(shake > 0) shake *= 0.85;
    if(shake < 0.05) shake = 0;

    ctx.save();
    if(shake > 0){
      const sx = (Math.random()-0.5) * shake;
      const sy = (Math.random()-0.5) * shake;
      ctx.translate(sx, sy);
    }

    drawCourt();
    drawPaddle(paddleL, COLOR_CYAN);
    drawPaddle(paddleR, COLOR_MAGENTA);
    drawBall();
    drawParticles();

    ctx.restore();

    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
